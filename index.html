<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - Share What You Love</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        // Lucide Icons as inline SVG components
        const Heart = ({ className, ...props }) => (
            <svg className={className} {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );
        
        const Film = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/>
                <path d="M7 3v18"/>
                <path d="M3 7.5h4"/>
                <path d="M3 12h18"/>
                <path d="M3 16.5h4"/>
                <path d="M17 3v18"/>
                <path d="M17 7.5h4"/>
                <path d="M17 16.5h4"/>
            </svg>
        );
        
        const Utensils = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                <path d="M7 2v20"/>
                <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
            </svg>
        );
        
        const Music = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
        );
        
        const Palette = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
            </svg>
        );
        
        const Shirt = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
            </svg>
        );
        
        const Gift = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="8" width="18" height="4" rx="1"/>
                <path d="M12 8v13"/>
                <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
                <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
            </svg>
        );
        
        const Star = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );
        
        const User = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        );
        
        const Share2 = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/>
                <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
            </svg>
        );
        
        const Plus = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M5 12h14"/>
                <path d="M12 5v14"/>
            </svg>
        );
        
        const Check = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M20 6 9 17l-5-5"/>
            </svg>
        );
        
        const X = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
            </svg>
        );

        const CATEGORIES = [
          { id: 'colors', name: 'Colors', icon: Palette, placeholder: 'Blue, Green...' },
          { id: 'movies', name: 'Movies', icon: Film, placeholder: 'The Matrix, Inception...' },
          { id: 'food', name: 'Food', icon: Utensils, placeholder: 'Pizza, Sushi...' },
          { id: 'restaurants', name: 'Restaurants', icon: Utensils, placeholder: 'Chipotle, Local Cafe...' },
          { id: 'music', name: 'Music/Artists', icon: Music, placeholder: 'Taylor Swift, The Beatles...' },
          { id: 'heroes', name: 'Superheroes', icon: Star, placeholder: 'Spider-Man, Wonder Woman...' },
          { id: 'clothing', name: 'Clothing Brands', icon: Shirt, placeholder: 'Nike, H&M...' },
          { id: 'gifts', name: 'Gift Ideas', icon: Gift, placeholder: 'Books, Candles...' },
        ];

        function FavoritesApp() {
          const [currentView, setCurrentView] = useState('welcome');
          const [userName, setUserName] = useState('');
          const [tempName, setTempName] = useState('');
          const [favorites, setFavorites] = useState({});
          const [editingCategory, setEditingCategory] = useState(null);
          const [tempInput, setTempInput] = useState('');

          const handleSignIn = () => {
            if (tempName.trim()) {
              setUserName(tempName.trim());
              setCurrentView('profile');
            }
          };

          const addFavorite = (categoryId) => {
            if (tempInput.trim()) {
              setFavorites(prev => ({
                ...prev,
                [categoryId]: [...(prev[categoryId] || []), tempInput.trim()]
              }));
              setTempInput('');
              setEditingCategory(null);
            }
          };

          const removeFavorite = (categoryId, index) => {
            setFavorites(prev => ({
              ...prev,
              [categoryId]: prev[categoryId].filter((_, i) => i !== index)
            }));
          };

          const totalFavorites = Object.values(favorites).reduce((sum, arr) => sum + arr.length, 0);

          if (currentView === 'welcome') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                  <div className="mb-6">
                    <Heart className="w-20 h-20 mx-auto text-pink-500 mb-4" />
                    <h1 className="text-4xl font-bold text-gray-800 mb-2">My Favorites</h1>
                    <p className="text-gray-600 text-lg">Share what you love with the people who care</p>
                  </div>
                  
                  <div className="mb-6">
                    <input
                      type="text"
                      placeholder="Enter your name"
                      value={tempName}
                      onChange={(e) => setTempName(e.target.value)}
                      onKeyPress={(e) => e.key === 'Enter' && handleSignIn()}
                      className="w-full px-4 py-3 text-lg border-2 border-gray-300 rounded-xl focus:outline-none focus:border-purple-500"
                    />
                  </div>
                  
                  <button
                    onClick={handleSignIn}
                    className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-xl text-lg font-semibold hover:shadow-lg transition-all"
                  >
                    Get Started
                  </button>
                  
                  <p className="text-sm text-gray-500 mt-6">Perfect for teachers, gift registries, and sharing with friends!</p>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gray-50">
              <div className="bg-gradient-to-r from-purple-500 to-pink-500 text-white p-6 shadow-lg">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <User className="w-8 h-8" />
                    <div>
                      <h1 className="text-2xl font-bold">{userName}'s Favorites</h1>
                      <p className="text-sm opacity-90">{totalFavorites} favorites added</p>
                    </div>
                  </div>
                  <button className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 hover:shadow-lg transition-all">
                    <Share2 className="w-4 h-4" />
                    Share
                  </button>
                </div>
              </div>

              <div className="max-w-4xl mx-auto p-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {CATEGORIES.map(category => {
                    const CategoryIcon = category.icon;
                    const items = favorites[category.id] || [];
                    const isEditing = editingCategory === category.id;

                    return (
                      <div key={category.id} className="bg-white rounded-2xl shadow-md p-6 hover:shadow-xl transition-all">
                        <div className="flex items-center gap-3 mb-4">
                          <div className="bg-gradient-to-br from-purple-100 to-pink-100 p-3 rounded-xl">
                            <CategoryIcon className="w-8 h-8 text-purple-600" />
                          </div>
                          <h3 className="text-xl font-bold text-gray-800">{category.name}</h3>
                        </div>

                        <div className="space-y-2 mb-4">
                          {items.length === 0 && !isEditing && (
                            <p className="text-gray-400 italic">No favorites yet</p>
                          )}
                          {items.map((item, index) => (
                            <div key={index} className="flex items-center justify-between bg-gray-50 px-3 py-2 rounded-lg">
                              <span className="text-gray-700">{item}</span>
                              <button
                                onClick={() => removeFavorite(category.id, index)}
                                className="text-red-500 hover:text-red-700"
                              >
                                <X className="w-4 h-4" />
                              </button>
                            </div>
                          ))}
                        </div>

                        {isEditing ? (
                          <div className="flex gap-2">
                            <input
                              type="text"
                              placeholder={category.placeholder}
                              value={tempInput}
                              onChange={(e) => setTempInput(e.target.value)}
                              onKeyPress={(e) => e.key === 'Enter' && addFavorite(category.id)}
                              className="flex-1 px-3 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-500"
                              autoFocus
                            />
                            <button
                              onClick={() => addFavorite(category.id)}
                              className="bg-purple-500 text-white p-2 rounded-lg hover:bg-purple-600"
                            >
                              <Check className="w-5 h-5" />
                            </button>
                            <button
                              onClick={() => {
                                setEditingCategory(null);
                                setTempInput('');
                              }}
                              className="bg-gray-300 text-gray-700 p-2 rounded-lg hover:bg-gray-400"
                            >
                              <X className="w-5 h-5" />
                            </button>
                          </div>
                        ) : (
                          <button
                            onClick={() => setEditingCategory(category.id)}
                            className="w-full bg-purple-100 text-purple-600 py-2 rounded-lg font-semibold flex items-center justify-center gap-2 hover:bg-purple-200 transition-all"
                          >
                            <Plus className="w-5 h-5" />
                            Add Favorite
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<FavoritesApp />, document.getElementById('root'));
    </script>
</body>
</html>
